[package]
name = "saga-stdlib"
version = "0.1.0"
edition = "2024"
description = "Safe Rust wrappers around the Saga platform's WebAssembly standard library: assets, threads, structured logging, engine clock, and save-file storage."
keywords = ["saga", "wasm", "wasm32", "modding", "no-std"]
categories = ["wasm", "no-std", "api-bindings", "game-development"]
license = "MIT OR Apache-2.0"
readme = "README.md"

[features]
default = []
std             = []
alloc_handler   = []

[dependencies]

[package.metadata.docs.rs]
targets = ["wasm32-unknown-unknown"]
rustdoc-args = ["--cfg", "docsrs"]
