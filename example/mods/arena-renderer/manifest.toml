name = "Arena Renderer"
description = "Pure-JS mod that draws ball + paddles + score onto a canvas and captures keyboard input. This module.js exports both the Phase 1 registration entrypoint (com_example_arena_renderer_register) and the Phase 2 saga_start entrypoint that boots the requestAnimationFrame loop and drives per-frame work for arena-physics and arena-ai."

entrypoint = "com_example_arena_renderer_register"

[dependencies]
"com.example.arena-assets"  = "^1.0.0"
"com.example.arena-physics" = "^1.0.0"
"com.example.arena-ai"      = "^1.0.0"
