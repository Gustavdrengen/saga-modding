[package]
name        = "arena_physics"
version     = "0.1.0"
edition     = "2024"
description = "Saga Rust → WebAssembly mod: ball + player paddle physics for the example game."
license     = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Path is relative to this Cargo.toml's directory:
#   ../        → example/mods/arena-physics/
#   ../../     → example/mods/
#   ../../../  → example/
#   ../../../../ → repo root → rust_bindings
saga-stdlib = { path = "../../../../rust_bindings" }

[profile.release]
opt-level     = "z"
lto           = true
codegen-units = 1
