[package]
name = "arena-physics"
version = "0.0.0"
edition = "2021"

[lib]
path = "src/lib.rs"
crate-type = ["cdylib"]

# Pure `no_std` — no `alloc::*`, no global allocator needed.
# The `saga-stdlib` crate is NOT pulled in here because:
#   1. arena-physics never reads assets or spawns threads in this example,
#   2. pulling `saga-stdlib` would force `feature = "alloc_handler"`,
#      which in turn requires `#[feature(alloc_error_handler)]` (unstable).

[profile.release]
opt-level = "s"
lto       = true
codegen-units = 1
panic     = "abort"
overflow-checks = false
