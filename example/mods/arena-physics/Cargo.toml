[package]
name = "arena-physics"
version = "0.0.0"
edition = "2021"

[lib]
path = "src/lib.rs"
crate-type = ["staticlib"]

[dependencies]
# Cargo traverses Git repositories to find packages in subdirectories,
# so this works even though saga-stdlib lives under rust_bindings/.
saga-stdlib = {
    git = "https://github.com/Gustavdrengen/saga-modding.git",
    package = "saga-stdlib",
}

# The example intentionally uses normal Rust `std`. Cargo packages the
# relocatable Wasm objects and runtime members into module.a; the Saga
# launcher links the archive with other mod archives.

[profile.dev]
panic = "abort"

[profile.release]
opt-level = "s"
lto       = true
codegen-units = 1
panic     = "abort"
overflow-checks = false
