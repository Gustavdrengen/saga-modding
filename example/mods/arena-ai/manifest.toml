id      = "com.example.arena-ai"
version = "1.0.0"

name = "Arena AI"
description = "C → WebAssembly mod that drives the AI opponent paddle. Ships one relocatable module.a archive, imports the physics C ABI, and demonstrates direct peer calls plus saga:log and saga:thread host imports."

entrypoint = "com_example_arena_ai_register"
exports = [
    "com_example_arena_ai_register",
    "com_example_arena_ai_tick",
    "com_example_arena_ai_direct_sample",
    "com_example_arena_ai_get_ai_x",
    "com_example_arena_ai_reset_ai",
    "com_example_arena_ai_worker",
]

[dependencies]
"com.example.arena-physics" = "^1.0.0"
